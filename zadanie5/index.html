<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista Gier Komputerowych</title>

        <script
            src="https://code.jquery.com/jquery-4.0.0.min.js" 
            integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" 
            crossorigin="anonymous">
        </script>

        <style>
           
        </style>

    </head>

    <body>

        <ul id="lista">
            <li>Chleb</li>
            <li>Mleko</li>
        </ul>
        <input type="text" id="produkt" placeholder="Nazwa produktu">
        <button id="naKoniec">Dodaj na koniec</button>
        <button id="naPoczatek">Dodaj na początek</button>
        <br>
        <input type="checkbox" id="answer" name="answer">
        <label for="answer">Zgadzam się na wysłanie</label>
        <button id="send" disabled>Wuślij</button>

 
    <script>
        $(function() {
            $("#answer").click(function(){
                if(this.checked){
                    $("#send").removeAttr("disabled")
                }else{
                    $("#send").attr("disabled","disabled")
                } 
            });
        });
    </script>


    </body>

   
</html>
