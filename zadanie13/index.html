<!DOCTYPE html>
<html lang="en">
<head>

    <script>
        $(function(){
            $("#sprawdz").click(function(){
                if($("#tekst").val().trim() === ""){
                    $("#komunikat").text("To pole jest puste.");
                }else{
                    $("#komunikat").text($("#tekst").val());
                }
            });

            $("#formularz").submit(function(e){
                e.preventDefault()
                if($("#nazwisko").val().trim() === "" || $("#nazwisko").val() === " "){
                    $("#komunikat2").text("Podaj nazwisko").css("color", "red");
                }else{
                    $("#komunikat2").text("Wyslano formularz").css("color", "green");
                }
            });

            $("#sprawdz2").click(function(){
                let wiek = $("#wiek").val();
                if(isNaN(wiek)){
                    $("#komunikat3").text("Wiek musi byc liczba");
                }else{
                    $("#komunikat3").text("Masz:" + wiek + "lat");
                }
            });


            $("#button").click(function(e){
                e.preventDefault()
                let ocena = $("#ocena").val().trim();
                console.log(ocena === "");
                console.log(isNaN(ocena));
                console.log(ocena > 1 );
                console.log(ocena < 6 );
                if(ocena === "" || isNaN(ocena)){
                    $("#komunikat4").text("To nie jest liczba");
                    
                }else if(ocena < 1 || ocena > 6){
                     $("#komunikat4").text("liczba poza zakresem");
                    
                }else{
                    $("#komunikat4").text("Zapisano ocene:" + ocena);
                }
            });

            //     if (ocenaStr === "" || isNaN(ocena) || ocena < 1 || ocena > 6) {

            //     } else {
            //         $('#komunikat4').text('Zapisano ocene: ' + ocena);
            //     }
            // });

            

        });
    </script>

    <style>

    </style>
</head>
<body>
    <input type="text" id="tekst">
    <input type="button" id="sprawdz" value="Check">
    <p id="komunikat"></p>
    <hr>

    <form id="formularz">
        <label for="label" id="nazwisko" >Nazwisko</label>
        <input type="text" id="nazwisko">
        <button type="submit">Wyslij</button>
        <p id="komunikat2"></p>
    </form>
    <hr>

    <input type="text" id="wiek">
    <button type="submit" id="sprawdz2">Wyslij</button>
    <p id="komunikat3"></p>

    <form id="formularz2">
