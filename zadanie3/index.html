<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista Gier Komputerowych</title>

        <script
            src="https://code.jquery.com/jquery-4.0.0.min.js" 
            integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" 
            crossorigin="anonymous">
        </script>

        <style>
            li{

            }
        </style>

    </head>

    <body>

        <ul id="lista">
            <li>Chleb</li>
            <li>Mleko</li>
        </ul>
        <input type="text" id="produkt" placeholder="Nazwa produktu">
        <button id="naKoniec">Dodaj na koniec</button>
        <button id="naPoczatek">Dodaj na początek</button>

 
    <script>
        $(function() {
            $("#naKoniec").click(function(){
                let x = $('#produkt').val();
                if(x.length != 0){
                    $('ul').append("<li>" + x +"<li>"); 
                    $("li").last.css( "color","blue");
                }
                $('#produkt').val("");     

            });

            $("#naPoczatek").click(function(){
                let y = $('#produkt').val();
                if(x.length != 0){
                    $('ul').prepend("<li>" + y +"<li>"); 
                    $("li").first.css( "color","greene");
                }
                $('#produkt').val("");     

            });




        });
    </script>


    </body>

   
</html>
