<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js" 
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" 
        crossorigin="anonymous">
    </script>




    <script>
        $(function(){ 
    $("#blok").click(function(){ 
        if ($(this).is(':visible')) { 
            $(this).hide(); 
        } else { 
            $(this).show(); 
        } 
    }); 

    $("#blok2").click(function(){ 
        $(this).toggle(); 
    }); 

    $("#blok3").click(function(){ 
        $(this).slideUp(); 
    }); 

    $("#blok4").click(function(){ 
        $(this).slideDown(); 
    }); 

    $("#blok5").click(function(){ 
        $(this).slideToggle(); 
    }); 
});


    </script>
        
    <style>
        #blok{
            background-color:green;
            width: 100px;
            height: 100px;
        }
        #blok2{
            background-color:red;
            width: 50px;
            height: 50px;
        }
        #blok3{
            background-color:fuchsia;
            width: 150px;
            height: 150px;
        }

        #blok2{
            background-color:gold;
            width: 70px;
            height: 70px;
        }
        #blok3{
            background-color:rgb(106, 59, 235);
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <div id="blok"></div>
    <div id="blok2"></div>
    <div id="blok3"></div>
    <div id="blok4"></div>
    <div id="blok5"></div>
</body>
</html>
