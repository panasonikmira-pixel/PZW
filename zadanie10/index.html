<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js" 
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" 
        crossorigin="anonymous">
    </script>




    <script>
        $(function(){
            $("#tekst").keyup(function(){
                let numberOfCharacters = $("#tekst").val().length
                if(numberOfCharacters <= 10){
                    $("#pozostalo").text("Pozostalo znakow:" + (10 - ($("#tekst").val().length)))
                    $("#pozostalo").removeClass("blad")
                }else{
                    $("#pozostalo").text("Pozostalo znakow:" + 0)
                    $("#pozostalo").addClass("blad")
                }
            })
            if(event.key == "Escape"){
                $("#pozostalo").text("Pozostalo znakow: 10")
                $("#pozostalo").removeClass("blad")
                $(this).val("")
            }

            if(event.key == "Enter" && $(this).val() == "admin"){
                console.log("Dostep przyznany")
            }

        });
    </script>
        
    <style>
        .blad{
            background-color:red;
        }
    </style>
</head>
<body>
    <input type="text" id="tekst">
    <p id="pozostalo">Pozostalo znakow:</p>
</body>
</html>
